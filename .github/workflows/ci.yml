name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (tests, CLI build, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # The desktop app needs X11/font libraries; the engine is what matters here.
      - run: cargo clippy --workspace --exclude profileport-desktop --all-targets -- -D warnings
      # Lint the Windows-only code (win.rs, system/windows.rs, the desktop app)
      # without a Windows machine. Check only: nothing is linked. blake3's
      # `pure` feature avoids its assembly, which needs Microsoft's assembler.
      - name: Clippy for Windows
        run: >-
          cargo clippy -p profileport-package -p profileport-engine -p profileport-cli -p profileport-desktop
          --features blake3/pure --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - run: cargo test --workspace --exclude profileport-desktop
      - run: cargo build --release -p profileport-cli
      - name: Linux smoke test
        run: scripts/unix-smoke.sh target/release/profileport-cli

  macos:
    name: macOS (tests, CLI build, smoke test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and integration tests
        run: cargo test --workspace --exclude profileport-desktop
      - name: Release build
        run: cargo build --release -p profileport-cli
      - name: macOS smoke test
        run: scripts/unix-smoke.sh target/release/profileport-cli
      - uses: actions/upload-artifact@v4
        with:
          name: profileport-cli-macos
          path: target/release/profileport-cli

  windows:
    name: Windows (tests, builds, smoke test)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and integration tests
        run: cargo test --workspace --exclude profileport-desktop
      - name: Desktop transfer tests
        run: cargo test -p profileport-desktop
      - name: Release builds
        run: cargo build --release -p profileport-cli -p profileport-desktop
      - name: Windows smoke test (junctions, long paths, locked files, attributes, ADS)
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Exe target/release/profileport-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: profileport-windows-x64
          path: |
            target/release/profileport-cli.exe
            target/release/ProfilePort.exe
