[package]
name = "profileport-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "ProfilePort export / restore engine"

[dependencies]
blake3 = "1.8.7"
profileport-package = { version = "0.1.0", path = "../package" }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Environment"] }
